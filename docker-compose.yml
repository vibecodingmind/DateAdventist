services:
  api:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: file:./data/adventhearts.db
      JWT_SECRET: ${JWT_SECRET:-adventhearts_dev_jwt_secret_change_me_32ch}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-adventhearts_dev_refresh_secret_change_me}
    volumes:
      - adventhearts-data:/app/data

volumes:
  adventhearts-data:
