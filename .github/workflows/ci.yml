name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: file:./test.db
      JWT_SECRET: ci_jwt_secret_adventhearts_32chars!!
      JWT_REFRESH_SECRET: ci_refresh_secret_adventhearts_32
      ARGON_MEMORY_COST: "4096"
      ARGON_TIME_COST: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm test
      - run: npm run build
